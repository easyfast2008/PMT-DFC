# PMT-DFC Cloudflare Worker configuration.
#
# Deploy with: wrangler deploy
#
# Before deploying, set TUNNEL_SERVER_URL and AUTH_KEY either here
# or as secrets: wrangler secret put AUTH_KEY

name = "pmt-relay"
main = "worker.js"
compatibility_date = "2024-01-01"

[vars]
TUNNEL_SERVER_URL = "https://YOUR_VPS_IP:8080"
# AUTH_KEY should be set as a secret instead of a var in production:
#   wrangler secret put AUTH_KEY
AUTH_KEY = "CHANGE_ME_TO_A_STRONG_SECRET"
